<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="screen">
        <div class="chat-header">
            <span id="room-display">Room: </span>
            <button id="leave-btn">Leave</button>
        </div>
        <div id="chat-display"></div>
        <div id="typing-label"></div>
        <div class="chat-footer">
            <input type="text" id="message-input" placeholder="Type a message..." maxlength="100">
            <span id="char-counter">0/100</span>
            <button id="send-btn">Send</button>
        </div>
    </div>

    <!-- Smart Fallback CDN Layer -->
    <script src="https://cloudflare.com"></script>
    <script>
        // If Cloudflare fails, dynamically try loading via unpkg's full direct bundle paths
        if (!window.supabase) {
            console.log("Cloudflare blocked, trying Unpkg...");
            document.write('<script src="https://unpkg.com"><\/script>');
        }
    </script>
    <script>
        // Final ultimate backup using modern browser module fetching if both traditional routes fail
        if (!window.supabase) {
            console.log("Unpkg blocked, trying Skypack module fallback...");
            document.write('<script src="https://skypack.dev"><\/script>');
        }
    </script>

    <!-- Load your custom chat code last -->
    <script src="/script.js"></script>
</body>
</html>
