<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Real-Time Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="auth-screen" class="screen">
        <h2>Join Private Chat</h2>
        <input type="text" id="username-input" placeholder="Enter Username">
        <input type="text" id="room-input" placeholder="Enter Room Code">
        <button id="join-btn">Join Chat</button>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen" class="screen hidden">
        <div class="chat-header">
            <span id="room-display">Room: </span>
            <button id="leave-btn">Leave</button>
        </div>
        <div id="chat-display"></div>
        <div id="typing-label"></div>
        <div class="chat-footer">
            <input type="text" id="message-input" placeholder="Type a message..." maxlength="100">
            <span id="char-counter">0/100</span>
            <button id="send-btn">Send</button>
        </div>
    </div>

    <!-- Official Supabase JS Client CDN -->
    <script src="https://jsdelivr.net"></script>
    <script src="script.js"></script>
</body>
</html>
