<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luxcord</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body class="landing">
<main class="auth-card">
  <div class="brand"><span>✦</span><div><h1>Luxcord</h1><p>Chat. Connect. Stay close.</p></div></div>
  <div id="auth-tabs"><button class="tab active" data-mode="login">Log in</button><button class="tab" data-mode="signup">Create account</button></div>
  <form id="auth-form">
    <label>Email<input id="email" type="email" required autocomplete="email"></label>
    <label>Password<input id="password" type="password" required minlength="6" autocomplete="current-password"></label>
    <label id="username-wrap" class="hidden">Username<input id="username" maxlength="32" autocomplete="username"></label>
    <button class="primary wide" type="submit" id="auth-submit">Log in</button>
    <p id="auth-error" class="error"></p>
  </form>
  <div class="guest-box"><span>Want to try the old room chat?</span><button id="guest-btn" class="secondary">Join as guest</button></div>
</main>
<div id="guest-modal" class="modal hidden"><div class="modal-card"><button class="x" data-close>×</button><h2>Join a room</h2><label>Username<input id="guest-name" maxlength="32"></label><label>Room code<input id="guest-room" maxlength="64"></label><button id="guest-join" class="primary wide">Join room</button></div></div>
<script>
const SUPABASE_URL="https://mvgqpkdldciwzqgpayoo.supabase.co";
const SUPABASE_KEY="sb_publishable_53vpmb7o0GOxHgeGmLIMeg_CrDK2oG4";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let mode="login";
(async()=>{const s=await sb.auth.getSession();if(s.data.session)location.href="chat.html"})();
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById("username-wrap").classList.toggle("hidden",mode!=="signup");document.getElementById("auth-submit").textContent=mode==="signup"?"Create account":"Log in";document.getElementById("auth-error").textContent=""});
document.getElementById("auth-form").onsubmit=async e=>{e.preventDefault();const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;let r;if(mode==="signup"){const username=document.getElementById("username").value.trim();if(!username)return; r=await sb.auth.signUp({email,password,options:{data:{username}}});if(!r.error&&!r.data.session)document.getElementById("auth-error").textContent="Account created. Check your email to confirm it."; }else r=await sb.auth.signInWithPassword({email,password});if(r.error)document.getElementById("auth-error").textContent=r.error.message;else if(r.data.session)location.href="chat.html"};
document.getElementById("guest-btn").onclick=()=>document.getElementById("guest-modal").classList.remove("hidden");
document.querySelector("[data-close]").onclick=()=>document.getElementById("guest-modal").classList.add("hidden");
document.getElementById("guest-join").onclick=()=>{const n=document.getElementById("guest-name").value.trim(),r=document.getElementById("guest-room").value.trim();if(n&&r)location.href="chat.html?name="+encodeURIComponent(n)+"&room="+encodeURIComponent(r)};
</script></body></html>
