<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Private Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="screen">
        <h2>Join Private Chat</h2>
        <input type="text" id="username-input" placeholder="Enter Username">
        <input type="text" id="room-input" placeholder="Enter Room Code">
        <button id="join-btn">Join Chat</button>
    </div>

    <script>
        const SUPABASE_URL = "https://mvgqpkdldciwzqgpayoo.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12Z3Fwa2RsZGNpd3pxZ3BheW9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2ODkzMTAsImV4cCI6MjEwNjI2NTMxMH0.7VSGwqyucBwdDCZzlS_xCLdLhEQaN3laJBYYDmGnN08";

        document.getElementById("join-btn").addEventListener("click", async () => {
            const username = document.getElementById("username-input").value.trim();
            const room = document.getElementById("room-input").value.trim();

            if (!username || !room) {
                alert("Please fill in both fields!");
                return;
            }

            try {
                // Check if username is taken using native fetch
                const response = await fetch(`${SUPABASE_URL}/rest/v1/user_status?room=eq.${encodeURIComponent(room)}&name=eq.${encodeURIComponent(username)}`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                
                const users = await response.json();
                const now = Date.now();

                if (users && users.length > 0 && (now - users[0].last_active < 15000)) {
                    alert("Username already active in this room!");
                    return;
                }

                window.location.href = `./chat.html?name=${encodeURIComponent(username)}&room=${encodeURIComponent(room)}`;
            } catch (err) {
                alert("Connection failed. Make sure your Supabase RLS is turned off!");
                console.error(err);
            }
        });
    </script>
</body>
</html>
